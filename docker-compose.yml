services:
  restoillimani:
    build: .
    container_name: restoillimani-whatsapp
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      # Dependencias de la imagen; si cambia package.json hace falta rebuild o npm install en el contenedor.
      - /app/node_modules
      - ./.wwebjs_auth:/app/.wwebjs_auth
      - ./tmp_audio:/app/tmp_audio

  dashboardillimani:
    build: ./dashboard
    container_name: restoillimani-dashboard
    restart: always
    ports:
      - "5174:5173"
    volumes:
      - ./dashboard:/app
      # node_modules en volumen aparte: el entrypoint del dashboard ejecuta npm install al iniciar.
      - /app/node_modules
      - ./.env:/app/.env:ro
